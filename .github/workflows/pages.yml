name: Publish research dashboard
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage public dashboard files
        run: |
          mkdir pages-output
          cp site/index.html site/styles.css site/app.js site/audit.json site/runs.json pages-output/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output
      - uses: actions/deploy-pages@v4
        id: deployment
